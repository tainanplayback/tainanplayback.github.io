{{- $image := .Page.Resources.Get .Destination -}}
{{- $src := "" -}}
{{- if $image -}}
  {{- $src = $image.RelPermalink -}}
{{- else -}}
  {{- $src = .Destination | safeURL -}}
{{- end -}}
<img src="{{ $src }}" alt="{{ .Text }}"
  {{- with .Attributes.width }} width="{{ . }}"{{ end -}}
  {{- with .Attributes.height }} height="{{ . }}"{{ end -}}
>
